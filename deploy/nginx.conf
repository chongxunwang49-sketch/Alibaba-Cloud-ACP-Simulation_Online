# Docker 版 Nginx：静态站点 + /api 反向代理
# 上游是 compose 服务名 api，端口 3004；容器内不要写成 127.0.0.1。
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 容器健康检查用，不写访问日志
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的构建产物，长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即拿到新资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 注意：proxy_pass 结尾不能带斜杠，否则 /api 前缀会被剥掉
    location /api/ {
        proxy_pass http://api:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Vue Router history 模式：找不到文件就回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
