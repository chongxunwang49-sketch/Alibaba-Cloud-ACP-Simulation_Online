# /etc/nginx/conf.d/acp.conf
# 站点根目录：/var/www/acp/dist（前端构建产物）
# API 反代：127.0.0.1:3004（Node/PM2），3004 不对外暴露

server {
    listen 80 default_server;
    server_name _;

    root /var/www/acp/dist;
    index index.html;

    # 精简日志，1 Mbps 小带宽下减少磁盘噪音
    access_log /var/log/nginx/acp.access.log;
    error_log  /var/log/nginx/acp.error.log warn;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # API：proxy_pass 结尾不要加斜杠，保留 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
